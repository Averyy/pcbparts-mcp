name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One run per ref at a time. Deploys from main queue instead of overlapping: two overlapping runs
# (a revert and a daily data deploy, say) could push `latest` out of order and leave prod on the
# older image. A newer push to a PR cancels that PR's running build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read  # the price-tiers artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Price breaks (data/catalog/price_tiers.tsv.gz) aren't in git: each daily scrape uploads them
      # as the price-tiers artifact, kept 7 days. Take the one from the scrape workflow's newest run
      # on main that has one: only that workflow uploads it, so a fork's pull request artifact of the
      # same name can't be picked, and runs of any status count, since the scrape run that triggers
      # this build is still finishing its last step. Each request is bounded (timeout 120) and so is
      # the step. This step never fails the build: without the file, replies give the 1-piece price only.
      - name: Download price tiers
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          warn() {
            echo "::warning title=No price tiers::$1; the image gives the 1-piece price only"
            echo "Price tiers: none ($1)" >> "$GITHUB_STEP_SUMMARY"
          }
          dir="$RUNNER_TEMP/price-tiers"
          rm -rf "$dir" && mkdir -p "$dir"
          if ! runs=$(timeout 120 gh api "repos/$REPO/actions/workflows/scrape-components.yml/runs?branch=main&per_page=10" \
              --jq '.workflow_runs[] | select(.head_repository.id == .repository.id) | .id'); then
            warn "listing the scrape runs failed"; exit 0
          fi
          id=""
          for run in $runs; do
            if ! id=$(timeout 120 gh api "repos/$REPO/actions/runs/$run/artifacts?name=price-tiers" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'); then
              warn "listing scrape run $run's artifacts failed"; exit 0
            fi
            if [ -n "$id" ]; then break; fi
          done
          if [ -z "$id" ]; then warn "no unexpired price-tiers artifact in the scrape's last 10 runs on main"; exit 0; fi
          if ! timeout 120 gh api "repos/$REPO/actions/artifacts/$id/zip" > "$dir/price-tiers.zip"; then
            warn "downloading artifact $id failed"; exit 0
          fi
          if ! unzip -q -o "$dir/price-tiers.zip" price_tiers.tsv.gz -d "$dir" || ! gzip -t "$dir/price_tiers.tsv.gz"; then
            warn "artifact $id has no readable price_tiers.tsv.gz"; exit 0
          fi
          header=$(gzip -cd "$dir/price_tiers.tsv.gz" | head -n 1 || true)
          case "$header" in
            "#scraped_at"*) ;;
            *) warn "artifact $id's price_tiers.tsv.gz has no #scraped_at line"; exit 0 ;;
          esac
          parts=$(gzip -cd "$dir/price_tiers.tsv.gz" | tail -n +2 | cut -f1 | uniq | wc -l | tr -d ' ') || parts="?"
          mv "$dir/price_tiers.tsv.gz" data/catalog/price_tiers.tsv.gz
          echo "Price tiers from artifact $id (scrape run $run): ${header#*$'\t'}, $parts parts"
          echo "Price tiers: $parts parts, scraped ${header#*$'\t'} (artifact $id, scrape run $run)" >> "$GITHUB_STEP_SUMMARY"

      # OpenAI's ChatGPT connector addresses get the AI platforms' higher per-address rate limit
      # (platform_ranges.py). OpenAI says the list can change, so each build takes a fresh copy when
      # it checks out (platform_ranges.py, standard library only) and otherwise keeps the committed
      # one. Prod deploys on every push to main, the daily scrape's included, so when the download
      # succeeds the list is about a day old; when it fails, this warns and the committed copy stays
      # (/health shows the list's creation date). The server never downloads it. This step never
      # fails the build. The check's output is downloaded text: it's printed as one line of at most
      # 300 characters, so nothing in it can start a workflow command (::error::, ::add-mask::).
      - name: Refresh OpenAI's address list
        continue-on-error: true
        run: |
          warn() { echo "::warning title=OpenAI address list not refreshed::$1; the image keeps the committed copy"; }
          dir="$RUNNER_TEMP/openai-ranges"
          committed=data/platform_ranges/openai-chatgpt-connectors.json
          rm -rf "$dir" && mkdir -p "$dir"
          if ! curl -fsSL --proto '=https' --proto-redir '=https' --max-time 30 --retry 2 --max-filesize 1000000 \
              -o "$dir/list.json" https://openai.com/chatgpt-connectors.json; then
            warn "downloading it failed"; exit 0
          fi
          checked=0
          summary=$(python3 -I src/pcbparts_mcp/platform_ranges.py "$dir/list.json" 2>&1) || checked=$?
          summary=$(printf '%s' "$summary" | tr -c '[:print:]' ' ' | cut -c1-300)
          if [ "$checked" -ne 0 ]; then
            warn "the download isn't a usable list: $summary"; exit 0
          fi
          if cmp -s "$dir/list.json" "$committed"; then
            echo "OpenAI address list unchanged from the committed copy: $summary"
          else
            cp "$dir/list.json" "$committed"
            echo "OpenAI address list refreshed: $summary"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # {{branch}} is empty on pull_request events, which made this tag "-<sha>-<date>" (an
            # invalid reference) and failed every PR build. PRs still get pr-N from type=ref above.
            type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDD'}},format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Deploy to VPS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/pcbparts-mcp || git clone git@github.com:Averyy/pcbparts-mcp.git /root/pcbparts-mcp && cd /root/pcbparts-mcp

            # Pull latest files from repo
            git fetch origin main
            git checkout origin/main -- docker-compose.yml
            git checkout origin/main -- landing/

            # Deploy the landing page and its optional .well-known directory.
            mkdir -p /var/www/pcbparts
            cp -r landing/* /var/www/pcbparts/
            if [ -d landing/.well-known ]; then
              cp -r landing/.well-known /var/www/pcbparts/
            fi

            # Pull the new image while the old container still serves, then swap containers. Stopping
            # first (down, then pull) left the site down for the whole download: calls during deploys
            # got an empty 502 ("Error POSTing to endpoint:" in MCP clients). The app starts in ~1s.
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f

            echo "Deployed successfully!"

      - name: Generate deployment summary
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          echo "## Deployed to VPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MCP endpoint: \`https://pcbparts.dev/mcp\`" >> $GITHUB_STEP_SUMMARY

  # Run after deployment so release failures cannot block it. Tag every version; publish minor
  # and major versions with validated entries since the last release. Reruns restore missing releases.
  release:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tag this version (and release minor or major versions)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ -z "$version" ]; then echo "::error::no version in pyproject.toml"; exit 1; fi
          tag="v$version"

          # Only an explicit HTTP 404 means absent; auth, transport and API errors are fatal.
          api_exists() {
            if gh api --include "$1" > "$RUNNER_TEMP/release-response" 2> "$RUNNER_TEMP/release-error"; then
              return 0
            fi
            if grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$RUNNER_TEMP/release-response"; then
              return 1
            fi
            cat "$RUNNER_TEMP/release-error" >&2
            echo "::error::could not check $1"
            exit 1
          }

          last=""
          case "$version" in
            *.0)
              if api_exists "repos/$GITHUB_REPOSITORY/releases/tags/$tag"; then
                if ! gh release view "$tag" > /dev/null; then
                  echo "::error::could not read release $tag"
                  exit 1
                fi
                echo "Release $tag already exists"
                exit 0
              fi
              if ! last=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""'); then
                echo "::error::could not list published releases"
                exit 1
              fi
              ;;
          esac
          python3 scripts/release_notes.py "$version" --last-release "${last#v}" > "$RUNNER_TEMP/notes.md"

          if api_exists "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"; then
            echo "Tag $tag already exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            echo "Tagged $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$version" in
            *.0)
              gh release create "$tag" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
              echo "Published release [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "$tag is a patch: its notes go out with the next minor or major release" ;;
          esac
