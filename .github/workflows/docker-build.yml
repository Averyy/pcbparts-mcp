name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One run per ref at a time. Deploys from main queue instead of overlapping: two overlapping runs
# (a revert and a daily data deploy, say) could push `latest` out of order and leave prod on the
# older image. A newer push to a PR cancels that PR's running build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # {{branch}} is empty on pull_request events, which made this tag "-<sha>-<date>" (an
            # invalid reference) and failed every PR build. PRs still get pr-N from type=ref above.
            type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDD'}},format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Deploy to VPS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/pcbparts-mcp || git clone git@github.com:Averyy/pcbparts-mcp.git /root/pcbparts-mcp && cd /root/pcbparts-mcp

            # Pull latest files from repo
            git fetch origin main
            git checkout origin/main -- docker-compose.yml
            git checkout origin/main -- landing/

            # Deploy landing page to web root
            mkdir -p /var/www/pcbparts
            cp -r landing/* /var/www/pcbparts/

            # Pull the new image while the old container still serves, then swap containers. Stopping
            # first (down, then pull) left the site down for the whole download: calls during deploys
            # got an empty 502 ("Error POSTing to endpoint:" in MCP clients). The app starts in ~1s.
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f

            echo "Deployed successfully!"

      - name: Generate deployment summary
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          echo "## Deployed to VPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MCP endpoint: \`https://pcbparts.dev/mcp\`" >> $GITHUB_STEP_SUMMARY

  # After a deploy from main, publish a GitHub release for pyproject.toml's version if it has none
  # yet, with that version's CHANGELOG.md section as the notes. Daily data commits keep the version,
  # so they skip this. A version with no "## X.Y.Z (date)" section fails here: add the entry.
  release:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ -z "$version" ]; then echo "::error::no version in pyproject.toml"; exit 1; fi
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v head="## $version " 'index($0, head) == 1 {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version (date)' section"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
          echo "Published release [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
