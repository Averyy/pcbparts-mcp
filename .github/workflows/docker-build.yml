name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One run per ref at a time. Deploys from main queue instead of overlapping: two overlapping runs
# (a revert and a daily data deploy, say) could push `latest` out of order and leave prod on the
# older image. A newer push to a PR cancels that PR's running build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read  # the price-tiers artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Price breaks (data/catalog/price_tiers.tsv.gz) aren't in git: each daily scrape uploads them
      # as the price-tiers artifact, kept 7 days. Take the newest from a run on this repository's
      # main (a fork's pull request can upload an artifact with the same name). This step never
      # fails the build: without the file, replies give the 1-piece price only.
      - name: Download price tiers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          warn() { echo "::warning title=No price tiers::$1; the image gives the 1-piece price only"; }
          dir="$RUNNER_TEMP/price-tiers"
          rm -rf "$dir" && mkdir -p "$dir"
          if ! id=$(gh api "repos/$REPO/actions/artifacts?name=price-tiers&per_page=100" --jq '
              [.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main"
                and .workflow_run.head_repository_id == .workflow_run.repository_id)]
              | sort_by(.created_at) | last | .id // empty'); then
            warn "listing the artifacts failed"; exit 0
          fi
          if [ -z "$id" ]; then warn "no unexpired price-tiers artifact from main"; exit 0; fi
          if ! gh api "repos/$REPO/actions/artifacts/$id/zip" > "$dir/price-tiers.zip"; then
            warn "downloading artifact $id failed"; exit 0
          fi
          if ! unzip -q -o "$dir/price-tiers.zip" price_tiers.tsv.gz -d "$dir" || ! gzip -t "$dir/price_tiers.tsv.gz"; then
            warn "artifact $id has no readable price_tiers.tsv.gz"; exit 0
          fi
          header=$(gzip -cd "$dir/price_tiers.tsv.gz" | head -n 1 || true)
          case "$header" in
            "#scraped_at"*) ;;
            *) warn "artifact $id's price_tiers.tsv.gz has no #scraped_at line"; exit 0 ;;
          esac
          mv "$dir/price_tiers.tsv.gz" data/catalog/price_tiers.tsv.gz
          echo "Price tiers from artifact $id: ${header#*$'\t'}"

      # OpenAI's ChatGPT connector addresses get the AI platforms' higher per-address rate limit
      # (platform_ranges.py). OpenAI says the list can change, so each build takes a fresh copy when
      # it checks out (platform_ranges.py, standard library only) and otherwise keeps the committed
      # one. Prod deploys on every push to main, the daily scrape's included, so the list is about a
      # day old at most; the server itself never downloads it. This step never fails the build.
      - name: Refresh OpenAI's address list
        continue-on-error: true
        run: |
          warn() { echo "::warning title=OpenAI address list not refreshed::$1; the image keeps the committed copy"; }
          dir="$RUNNER_TEMP/openai-ranges"
          committed=data/platform_ranges/openai-chatgpt-connectors.json
          rm -rf "$dir" && mkdir -p "$dir"
          if ! curl -fsSL --max-time 30 --retry 2 --max-filesize 1000000 -o "$dir/list.json" \
              https://openai.com/chatgpt-connectors.json; then
            warn "downloading it failed"; exit 0
          fi
          if ! summary=$(python3 -I src/pcbparts_mcp/platform_ranges.py "$dir/list.json" 2>&1); then
            warn "the download isn't a usable list: $summary"; exit 0
          fi
          if cmp -s "$dir/list.json" "$committed"; then
            echo "OpenAI address list unchanged from the committed copy: $summary"
          else
            cp "$dir/list.json" "$committed"
            echo "OpenAI address list refreshed: $summary"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # {{branch}} is empty on pull_request events, which made this tag "-<sha>-<date>" (an
            # invalid reference) and failed every PR build. PRs still get pr-N from type=ref above.
            type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDD'}},format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Deploy to VPS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/pcbparts-mcp || git clone git@github.com:Averyy/pcbparts-mcp.git /root/pcbparts-mcp && cd /root/pcbparts-mcp

            # Pull latest files from repo
            git fetch origin main
            git checkout origin/main -- docker-compose.yml
            git checkout origin/main -- landing/

            # Deploy landing page to web root
            mkdir -p /var/www/pcbparts
            cp -r landing/* /var/www/pcbparts/

            # Pull the new image while the old container still serves, then swap containers. Stopping
            # first (down, then pull) left the site down for the whole download: calls during deploys
            # got an empty 502 ("Error POSTing to endpoint:" in MCP clients). The app starts in ~1s.
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f

            echo "Deployed successfully!"

      - name: Generate deployment summary
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          echo "## Deployed to VPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MCP endpoint: \`https://pcbparts.dev/mcp\`" >> $GITHUB_STEP_SUMMARY

  # After a deploy from main, publish a GitHub release for pyproject.toml's version if it has none
  # yet, with that version's CHANGELOG.md section as the notes. Daily data commits keep the version,
  # so they skip this. A version with no "## X.Y.Z (date)" section fails here: add the entry.
  release:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ -z "$version" ]; then echo "::error::no version in pyproject.toml"; exit 1; fi
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v head="## $version " 'index($0, head) == 1 {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version (date)' section"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
          echo "Published release [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
