name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows catches path-separator and locale-encoding (cp1252) bugs that Linux/macOS hide.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # bash on Windows too: pwsh doesn't stop at a failing line in a multi-line step.
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build databases
        run: |
          python scripts/build_database.py --quiet
          python scripts/build_sensor_db.py --quiet
          python scripts/build_boards_db.py --quiet
          python scripts/build_history_db.py --quiet

      # Integration tests hit live APIs and stay local-only (pytest -m integration).
      - name: Unit tests
        run: python -m pytest tests/ -q -p no:cacheprovider
