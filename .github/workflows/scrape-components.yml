name: Scrape JLCPCB Components

on:
  schedule:
    # Daily at 12:21 UTC (7:21 AM EST / 8:21 PM China)
    - cron: '21 12 * * *'
  workflow_dispatch:
    # Manual trigger with optional parameters
    inputs:
      workers:
        description: 'Number of concurrent workers'
        required: false
        default: '10'
        type: choice
        options:
          - '4'
          - '6'
          - '8'
          - '10'
      allow_part_drop:
        description: 'Allow a deliberate part count drop greater than 5%'
        required: false
        default: false
        type: boolean

# Prevent multiple scrape runs from overlapping
concurrency:
  group: scrape-jlcpcb
  cancel-in-progress: false  # Let running scrape finish

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ~8-15 min with 10 workers, plenty of buffer

    permissions:
      contents: write
      actions: write  # Needed to trigger deploy workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "wafer-py==0.4.6" "wreq==0.12.3"

      - name: Run scraper
        env:
          ALLOW_PART_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_part_drop || false }}
        run: |
          WORKERS="${{ github.event.inputs.workers || '10' }}"
          echo "Running scraper with $WORKERS workers..."
          python scripts/scrape_components.py --workers "$WORKERS"

      - name: Show scrape results
        run: |
          echo "=== Manifest ==="
          cat data/manifest.json | python -m json.tool
          echo ""
          echo "=== File sizes ==="
          du -sh data/
          du -sh data/catalog/

      - name: Check part count
        env:
          ALLOW_PART_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_part_drop || false }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          import sys
          sys.path.insert(0, "scripts")
          from check_component_scrape import validate_manifest
          previous = json.loads(subprocess.check_output(["git", "show", "HEAD:data/manifest.json"]))
          with open("data/manifest.json") as stream:
              current = json.load(stream)
          print(f"Part count: previous={previous['total_parts']}, current={current['total_parts']}", flush=True)
          failures = validate_manifest(previous, current,
              allow_count_drop=os.environ.get("ALLOW_PART_DROP", "false").lower() == "true")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Commit and push data files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add JSON files only (DB is built at Docker build time)
          git add data/catalog/ data/manifest.json data/subcategories.json data/history/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            # Get part count from manifest
            PARTS=$(python -c "import json; print(json.load(open('data/manifest.json'))['total_parts'])")
            git commit -m "Update component data: ${PARTS} parts ($(date +%Y-%m-%d))"
            # Main may have moved during the ~15-min scrape; data-only commits rebase cleanly
            git pull --rebase origin main
            git push
            echo "Data committed and pushed"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          echo "Waiting 2 minutes for commit to propagate..."
          sleep 120
          gh workflow run docker-build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
