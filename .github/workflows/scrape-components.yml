name: Scrape JLCPCB Components

on:
  schedule:
    # Backup only: 12:21 UTC (7:21 AM EST / 8:21 PM China). GitHub starts scheduled runs hours late
    # and sometimes not at all (no run on 2026-11-17), so the daily scrape is started by a cron job
    # on the VPS through workflow_dispatch (docs/ref-scrape-schedule.md); this one is skipped when
    # that day's scrape is already on main (the `check` job).
    - cron: '21 12 * * *'
  workflow_dispatch:
    # The VPS's daily trigger, and manual runs, with optional parameters
    inputs:
      workers:
        description: 'Number of concurrent workers'
        required: false
        default: '10'
        type: choice
        options:
          - '4'
          - '6'
          - '8'
          - '10'
      allow_part_drop:
        description: 'Allow a deliberate part count drop greater than 5%'
        required: false
        default: false
        type: boolean

# Prevent multiple scrape runs from overlapping
concurrency:
  group: scrape-jlcpcb
  cancel-in-progress: false  # Let running scrape finish

jobs:
  # A scheduled (backup) run does nothing when main already has today's scrape. Dispatched runs
  # always scrape.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.today.outputs.run }}
    steps:
      - name: Checkout the manifest
        uses: actions/checkout@v7
        with:
          ref: main  # the branch tip now, not the commit this run was created on
          sparse-checkout: data/manifest.json
          sparse-checkout-cone-mode: false
      - name: Has today's scrape run?
        id: today
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            scraped=$(python3 -c "import json; print(json.load(open('data/manifest.json'))['scraped_at'][:10])" 2>/dev/null || true)
            if [ -n "$scraped" ] && [ "$scraped" = "$(date -u +%F)" ]; then
              run=false
              echo "::notice title=Scrape skipped::main already has the $scraped scrape"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  scrape:
    needs: check
    # A dispatched run always scrapes, even if the check job itself failed; a scheduled one only
    # when the check said today's scrape is missing (or couldn't tell)
    if: always() && (github.event_name != 'schedule' || needs.check.outputs.run != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ~8-15 min with 10 workers, plenty of buffer

    permissions:
      contents: write
      actions: write  # Needed to trigger deploy workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "wafer-py==0.7.19" "wreq==0.13.0"

      - name: Run scraper
        env:
          ALLOW_PART_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_part_drop || false }}
        run: |
          WORKERS="${{ github.event.inputs.workers || '10' }}"
          echo "Running scraper with $WORKERS workers..."
          python scripts/scrape_components.py --workers "$WORKERS"

      - name: Show scrape results
        run: |
          echo "=== Manifest ==="
          cat data/manifest.json | python -m json.tool
          echo ""
          echo "=== File sizes ==="
          du -sh data/
          du -sh data/catalog/

      - name: Check part count
        env:
          ALLOW_PART_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_part_drop || false }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          import sys
          sys.path.insert(0, "scripts")
          from check_component_scrape import validate_manifest
          previous = json.loads(subprocess.check_output(["git", "show", "HEAD:data/manifest.json"]))
          with open("data/manifest.json") as stream:
              current = json.load(stream)
          print(f"Part count: previous={previous['total_parts']}, current={current['total_parts']}", flush=True)
          failures = validate_manifest(previous, current,
              allow_count_drop=os.environ.get("ALLOW_PART_DROP", "false").lower() == "true")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Commit and push data files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add JSON files only (DB is built at Docker build time). price_tiers.tsv.gz is ignored,
          # so this skips it (it goes up as an artifact below).
          git add data/catalog/ data/manifest.json data/subcategories.json data/history/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            # Get part count from manifest
            PARTS=$(python -c "import json; print(json.load(open('data/manifest.json'))['total_parts'])")
            git commit -m "Update component data: ${PARTS} parts ($(date +%Y-%m-%d))"
            # Main may have moved during the ~15-min scrape; data-only commits rebase cleanly
            git pull --rebase origin main
            git push
            echo "Data committed and pushed"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # Every part's price breaks from this scrape (data/catalog/price_tiers.tsv.gz) stay out of git
      # (.gitignore): docker-build.yml downloads the newest price-tiers artifact for the image build.
      # After the push, so a stalled or failed upload can never cost the day's commit (the push uses
      # GITHUB_TOKEN, which starts no build), and before "Trigger deploy", so the build it starts
      # finds this one. A failed upload only leaves that build with the previous artifact (or the
      # 1-piece prices).
      - name: Upload price tiers
        continue-on-error: true
        timeout-minutes: 5  # a 10 MB upload takes seconds; the job's 60 minutes are the scrape's
        uses: actions/upload-artifact@v7
        with:
          name: price-tiers
          path: data/catalog/price_tiers.tsv.gz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0  # already gzipped
          overwrite: true  # a re-run job replaces its own earlier upload

      - name: Trigger deploy
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          echo "Waiting 2 minutes for commit to propagate..."
          sleep 120
          gh workflow run docker-build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
