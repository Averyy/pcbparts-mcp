services:
  pcbparts-mcp:
    # Use GHCR image in production, or build locally with: docker compose build
    image: ghcr.io/averyy/pcbparts-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcbparts-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - web
    volumes:
      # EasyEDA footprint answers, CSE searches/KiCad files and Mouser/DigiKey answers and lifecycle
      # (EASYEDA_STORE_PATH, CSE_STORE_PATH, DISTRIBUTOR_STORE_PATH), request counts, usage stats,
      # and application logs (Dockerfile's LOG_PATH=/app/cache/logs/application.log, kept 7 days);
      # `docker compose down` keeps named volumes
      - pcbparts-cache:/app/cache
    env_file:
      - path: .env
        required: false
    environment:
      - HTTP_PORT=8080
      - RATE_LIMIT_REQUESTS=300
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4096M  # components.db is ~800 MB and must stay in the page cache (searches read most of it), plus history.db and Python
          cpus: '3.0'  # the event loop and the database workers run at the same time (SQLite releases the GIL)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

volumes:
  pcbparts-cache:
