services:
  pcbparts-mcp:
    # Use GHCR image in production, or build locally with: docker compose build
    image: ghcr.io/averyy/pcbparts-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcbparts-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - web
    volumes:
      # EasyEDA footprint answers, CSE searches/KiCad files and Mouser/DigiKey answers and lifecycle
      # (EASYEDA_STORE_PATH, CSE_STORE_PATH, DISTRIBUTOR_STORE_PATH), request counts, usage stats,
      # and application logs (Dockerfile's LOG_PATH=/app/cache/logs/application.log, kept 30 days);
      # `docker compose down` keeps named volumes
      - pcbparts-cache:/app/cache
    env_file:
      - path: .env
        required: false
    environment:
      - HTTP_PORT=8080
      - RATE_LIMIT_REQUESTS=300
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4096M  # components.db is ~800 MB and must stay in the page cache (searches read most of it), plus history.db and Python
          cpus: '3.0'  # the event loop and the database workers run at the same time (SQLite releases the GIL)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Private usage dashboard (dashboard/): reads /mcp/stats hourly with STATS_TOKEN, keeps every day
  # in SQLite and serves one page behind HTTP Basic auth; Caddy on the VPS routes its subdomain here
  # (pcbparts-dashboard:8050 on the web network, no published port). It refuses to start without
  # DASHBOARD_PASSWORD in the VPS's .env, which never affects pcbparts-mcp.
  # Opt-in: `docker compose up -d` starts only the server; `--profile dashboard` (or
  # COMPOSE_PROFILES=dashboard, as the deploy sets) adds this. Self-hosting it, point
  # DASHBOARD_STATS_URL and DASHBOARD_HEALTH_URL at your own server.
  pcbparts-dashboard:
    profiles: ["dashboard"]
    image: ghcr.io/averyy/pcbparts-mcp-dashboard:latest
    build:
      context: ./dashboard
    container_name: pcbparts-dashboard
    restart: unless-stopped
    networks:
      - web
    volumes:
      - pcbparts-dashboard-data:/app/data
    environment:
      - STATS_TOKEN=${STATS_TOKEN:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - STATS_URL=${DASHBOARD_STATS_URL:-https://pcbparts.dev/mcp/stats}
      - HEALTH_URL=${DASHBOARD_HEALTH_URL:-https://pcbparts.dev/health}
      # optional: count problems from a fixed moment instead of the latest deploy it saw
      - PROBLEMS_SINCE=${DASHBOARD_PROBLEMS_SINCE:-}
      - PROBLEMS_VERSION=${DASHBOARD_PROBLEMS_VERSION:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  web:
    external: true

volumes:
  pcbparts-cache:
  pcbparts-dashboard-data:
