[project]
name = "pcbparts-mcp"
version = "0.5.1"
description = "MCP server for searching electronic components for PCB design and assembly"
requires-python = ">=3.12"
# Dependencies are pinned to exact versions so a rebuild never silently pulls a new major/minor
# that changes behavior (fastmcp 3.x added Host-header 421s; wafer 0.3 changed timeout semantics).
# The Dockerfile pins the same versions (it pip-installs directly, bypassing this lock). Bump
# deliberately: change the pin, run the full suite + a Docker build, re-check the Host-header test.
dependencies = [
    # MCP SDK and FastMCP framework. fastmcp 3.x DNS-rebinding protection 421s any Host header not
    # in a localhost-only default — we pass allowed_hosts in http_app (server.create_app).
    "mcp==1.25.0",
    "fastmcp==3.4.3",
    # Anti-detection HTTP client (TLS fingerprinting, WAF solving, rotation)
    "wafer-py==0.3.0",
    # HTTP client for Mouser/DigiKey APIs
    "httpx==0.28.1",
    # ASGI server and middleware
    "uvicorn[standard]==0.40.0",
    "starlette==1.3.1",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "defusedxml==0.8.0rc2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbparts_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits live APIs (JLCPCB, EasyEDA) — run with pytest -m integration",
    "quality: board search quality evaluation — run with pytest -m quality",
]
addopts = "-m 'not integration and not quality'"
